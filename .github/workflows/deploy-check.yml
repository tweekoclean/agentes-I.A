name: Conferir deploy AtendeAI
on:
  push:
    branches: [main]
    paths: ["atendeai/**", "main.py", ".github/workflows/deploy-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx==0.28.1
      - name: Conferir versão, banco e conversa de demonstração
        run: |
          python - <<'PY'
          from urllib.parse import parse_qs, urlsplit
          import time
          import httpx
          base = "https://nelvo.squareweb.app"
          with httpx.Client(timeout=10, follow_redirects=False) as client:
              for attempt in range(18):
                  try:
                      response = client.get(base + "/")
                      response.raise_for_status()
                      if response.json().get("versao") == "0.10.1":
                          break
                  except (httpx.HTTPError, ValueError):
                      pass
                  if attempt == 17:
                      raise SystemExit("A aplicação ainda não respondeu com a versão 0.10.1.")
                  time.sleep(5)
              health = client.get(base + "/health")
              health.raise_for_status()
              assert health.json()["status"] == "ok"
              print("Versão 0.10.1 publicada; banco conectado.")
              for route in ("/painel", "/painel/painel.css", "/painel/painel.js", "/aplicar", "/aplicar/conteudo", "/aplicar/formulario.js", "/marca.png", "/home/home.css", "/home/home.js", "/home/tema.js"):
                  panel = client.get(base + route)
                  panel.raise_for_status()
                  assert panel.headers.get("cache-control") == "no-store"
              private = client.get(base + "/v1/atendimento/empresas")
              assert private.status_code == 401
              assert client.get(base + "/v1/funil").status_code == 401
              landing = client.get(base + "/", headers={"Accept": "text/html"})
              landing.raise_for_status()
              assert 'class="home-page"' in landing.text
              assert "Fale com um especialista" in landing.text
              assert 'id="application-modal"' in landing.text
              assert 'id="services-story"' in landing.text
              assert 'id="nelvo-film"' in landing.text
              assert 'id="film-sound"' not in landing.text
              assert 'data-theme-toggle' in landing.text
              assert 'services-footer' not in landing.text
              form = client.get(base + "/aplicar/conteudo")
              assert 'id="public-application-form"' in form.text
              assert form.text in client.get(base + "/aplicar").text
              video = client.get(base + "/home/visuais/nelvo-intro.mp4", headers={"Range": "bytes=0-31"})
              assert video.status_code == 206
              assert b"ftyp" in video.content
              for asset in ("nelvo-poster.jpg", "nelvo-connected.png", "nelvo-studio.png"):
                  visual = client.get(base + "/home/visuais/" + asset, headers={"Range": "bytes=0-31"})
                  assert visual.status_code == 206
              captions = client.get(base + "/home/visuais/nelvo-intro.vtt")
              assert captions.status_code == 200 and captions.text.startswith("WEBVTT")
              catalog = client.get(base + "/publico/aplicacoes/catalogo")
              catalog.raise_for_status()
              assert "RJ" in catalog.json()["estados"]
              assert len(catalog.json()["servicos"]) == 4
              print("Painel e recursos publicados; dados administrativos continuam protegidos.")
              demo = client.get(base + "/demonstracao")
              assert demo.status_code in (302, 307)
              location = demo.headers["location"]
              query = parse_qs(urlsplit(location).query)
              tenant, key = query["empresa"][0], query["chave"][0]
              page = client.get(base + location)
              page.raise_for_status()
              widget = client.get(base + "/widget/atendeai.js")
              widget.raise_for_status()
              opened = client.post(base + "/v1/atendimento/site/" + tenant + "/conversas",
                                   headers={"Origin": base, "X-Site-Key": key})
              opened.raise_for_status()
              session = opened.json()
              path = base + "/v1/atendimento/site/" + tenant + "/conversas/" + session["conversa"]["id"] + "/mensagens"
              headers = {"Origin": base, "Authorization": "Bearer " + session["token_conversa"]}
              question = client.post(path, headers=headers, json={"texto":"Quais serviços vocês oferecem?","id_cliente":"smoke-question"})
              question.raise_for_status()
              for attempt in range(90):
                  history = client.get(path, headers=headers)
                  history.raise_for_status()
                  data = history.json()
                  if any(item.get("modo") in {"base_sem_ia", "ia"} and item.get("autor") == "assistente" for item in data["mensagens"]):
                      break
                  if data["conversa"]["estado"] == "humano":
                      raise SystemExit("Pergunta sobre serviços encaminhada indevidamente: " + str(data["conversa"].get("motivo_pausa")))
                  if attempt == 89:
                      raise SystemExit("A resposta do assistente não ficou disponível.")
                  time.sleep(2)
              for label, text in (("trivia", "Qual é a capital do Japão?"), ("ameaca", "Vou te matar")):
                  outgoing = sum(item["direcao"] == "saida" for item in data["mensagens"])
                  ignored = client.post(path, headers=headers, json={"texto": text, "id_cliente": "smoke-" + label})
                  ignored.raise_for_status()
                  identifier = ignored.json()["id"]
                  for attempt in range(20):
                      history = client.get(path, headers=headers)
                      history.raise_for_status()
                      data = history.json()
                      item = next(item for item in data["mensagens"] if item["id"] == identifier)
                      if item["status"] == "ignorada":
                          assert sum(item["direcao"] == "saida" for item in data["mensagens"]) == outgoing
                          assert data["conversa"]["estado"] == "bot"
                          assert not data["conversa"]["aguardando_confirmacao"]
                          break
                      if item["status"] == "processada" or attempt == 19:
                          raise SystemExit("Mensagem fora do atendimento não foi ignorada: " + label)
                      time.sleep(2)
              print("Pergunta geral e ameaça ignoradas sem resposta ou encaminhamento.")
              handoff = client.post(path, headers=headers, json={"texto":"[Teste automático de implantação] Quero falar com um atendente.","id_cliente":"smoke-handoff"})
              handoff.raise_for_status()
              for attempt in range(20):
                  history = client.get(path, headers=headers)
                  history.raise_for_status()
                  data = history.json()
                  if data["conversa"]["estado"] == "humano":
                      assert any(item["texto"] == "Estou encaminhando seu chamado para um responsável dar continuidade ao atendimento." for item in data["mensagens"])
                      break
                  if attempt == 19:
                      raise SystemExit("O encaminhamento não foi concluído.")
                  time.sleep(2)
              print("Chat de demonstração: sessão privada, resposta do assistente e encaminhamento com IA pausada verificados.")
              print("Teste somente no site; nenhum envio de WhatsApp ou chamada paga de IA.")
          PY
