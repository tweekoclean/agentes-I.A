name: Testes AtendeAI
on:
  push:
    branches: [main, codex/atendimento-site-whatsapp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check atendeai/static/widget.js
      - run: python manage.py gerar-sql
