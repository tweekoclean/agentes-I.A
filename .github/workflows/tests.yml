name: Testes AtendeAI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check atendeai/static/widget.js
      - run: node --check atendeai/static/panel.js
      - run: node --check atendeai/static/application.js
      - run: python manage.py gerar-sql
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-package-lock --no-save --prefix "$RUNNER_TEMP/atendeai-browser" playwright@1.62.1
      - run: node "$RUNNER_TEMP/atendeai-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verificar o painel e a conversa do cliente no navegador
        run: node tests/panel-e2e.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/atendeai-browser/node_modules
          PANEL_TEST_OUTPUT: ${{ runner.temp }}/atendeai-panel-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: painel-desktop-mobile
          path: ${{ runner.temp }}/atendeai-panel-check
          if-no-files-found: ignore
